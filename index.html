<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>サイトタイトル | サブタイトル</title>
    <!-- TODO: description は 120 文字以内 -->
    <meta
      name="description"
      content="サイトの説明文を120文字以内で簡潔に書きます。検索結果に表示される重要な要素です。"
    />
    <!-- TODO: author を実名 / 会社名に -->
    <meta name="author" content="作者名" />
    <meta name="generator" content="Vite" />
    <!-- TODO: ホーム画面追加時の表示名 -->
    <meta name="application-name" content="サイト名" />

    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="googlebot" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <!-- theme -->
    <!-- <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" /> -->

    <link rel="canonical" href="https://example.com/" />
    <link rel="alternate" hreflang="ja" href="https://example.com/" />
    <link rel="alternate" hreflang="x-default" href="https://example.com/" />

    <!-- favicon size 16x16, 32x32 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- apple-touch-icon size 180x180 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Android-icon 192x192, 512x512 (manifest内で指定) -->
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="サイト名" />
    <meta property="og:title" content="ページタイトル" />
    <meta
      property="og:description"
      content="OGP用の説明文。SNSでシェアされた時に表示される文章。"
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="https://example.com/ogp.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="サイトタイトルのOGP画像" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@your_handle" />
    <meta name="twitter:creator" content="@your_handle" />
    <meta name="twitter:title" content="ページタイトル" />
    <meta name="twitter:description" content="Twitterカード用の説明文。" />
    <meta name="twitter:image" content="https://example.com/ogp.png" />
    <meta name="twitter:image:alt" content="サイトタイトルのOGP画像" />

    <!-- jsonld -->

    <!-- font -->
    <!-- Google Fonts を使う場合のみコメント解除
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    -->

    <!-- css -->
    <link rel="stylesheet" href="/src/style.css" />
    <!-- js -->
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <!-- header -->
    <main>
      <!-- ここにセクション貼る -->
    </main>
    <!-- footer -->
  </body>
</html>

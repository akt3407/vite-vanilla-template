<!doctype html>
<html lang="ja">
  <head>
    <!-- =========================================================
         1. 文字コード / ビューポート (最優先)
         ========================================================= -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =========================================================
         2. 基本メタ (検索結果に直接表示される)
         ========================================================= -->
    <!-- TODO: title は 32 文字程度を目安に -->
    <title>サイトタイトル | サブタイトル</title>
    <!-- TODO: description は 120 文字以内 -->
    <meta
      name="description"
      content="サイトの説明文を120文字以内で簡潔に書きます。検索結果に表示される重要な要素です。"
    />
    <!-- TODO: author を実名 / 会社名に -->
    <meta name="author" content="作者名" />
    <meta name="generator" content="Vite" />
    <!-- TODO: ホーム画面追加時の表示名 -->
    <meta name="application-name" content="サイト名" />

    <!-- =========================================================
         3. クロール制御
         ========================================================= -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="googlebot" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <!-- =========================================================
         4. 表示テーマ (ライト / ダーク両対応)
         ========================================================= -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- =========================================================
         5. canonical / hreflang
         TODO: 本番URLに置換 (以下すべての example.com を一括置換)
         ========================================================= -->
    <link rel="canonical" href="https://example.com/" />
    <link rel="alternate" hreflang="ja" href="https://example.com/" />
    <link rel="alternate" hreflang="x-default" href="https://example.com/" />

    <!-- =========================================================
         6. アイコン / マニフェスト
         TODO: apple-touch-icon.png と android-chrome-{192,512}.png を /public/ に配置
         ========================================================= -->
    <!-- favicon size 16x16, 32x32 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- apple-touch-icon size 180x180 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Android-icon 192x192, 512x512 (manifest内で指定) -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- =========================================================
         7. Open Graph (Facebook / LINE / Slack 等)
         ========================================================= -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="サイト名" />
    <meta property="og:title" content="ページタイトル" />
    <meta
      property="og:description"
      content="OGP用の説明文。SNSでシェアされた時に表示される文章。"
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="https://example.com/ogp.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="サイトタイトルのOGP画像" />

    <!-- =========================================================
         8. Twitter Card
         ========================================================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- TODO: 公式Twitterアカウントの@ハンドル -->
    <meta name="twitter:site" content="@your_handle" />
    <meta name="twitter:creator" content="@your_handle" />
    <meta name="twitter:title" content="ページタイトル" />
    <meta name="twitter:description" content="Twitterカード用の説明文。" />
    <meta name="twitter:image" content="https://example.com/ogp.png" />
    <meta name="twitter:image:alt" content="サイトタイトルのOGP画像" />

    <!-- =========================================================
         9. 構造化データ (JSON-LD) — WebSite + Organization
         本体は src/seo/jsonld.js に分離。ビルド時に下記コメントを
         <script type="application/ld+json"> に置換 (vite.config.js)
         ========================================================= -->
    <!-- jsonld -->

    <!-- =========================================================
         10. プリコネクト (フォントを使うときだけ有効化)
         ========================================================= -->
    <!-- Google Fonts を使う場合のみコメント解除
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    -->

    <!-- =========================================================
         11. CSS / JS
         ========================================================= -->
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="bg-white text-slate-900 antialiased">
    <load src="src/sections/header.html" />
    <main>
      <load src="src/sections/hero.html" />
      <load src="src/sections/features.html" />
    </main>
    <load src="src/sections/footer.html" />
  </body>
</html>
